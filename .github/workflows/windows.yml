name: Windows downloadable app
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string
      publish:
        description: Upload to the existing release (requires approval)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install pyinstaller==6.22.0
      - name: Test Windows service and control window
        run: python windows_launcher.py --smoke-test
      - name: Build terminal-free executable
        run: python -m PyInstaller --noconfirm --windowed --onedir --name "Bookmark Brain" windows_launcher.py
      - name: Verify bundled app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath 'dist/Bookmark Brain/Bookmark Brain.exe' -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Bundled smoke test failed: $($p.ExitCode)" }
      - name: Package and verify extracted download
        shell: pwsh
        run: |
          Copy-Item WINDOWS.md 'dist/Bookmark Brain/READ ME.md'
          Compress-Archive -Path 'dist/Bookmark Brain' -DestinationPath 'Bookmark-Brain-Windows-x64.zip'
          Expand-Archive 'Bookmark-Brain-Windows-x64.zip' 'archive-check'
          $p = Start-Process -FilePath 'archive-check/Bookmark Brain/Bookmark Brain.exe' -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Archive smoke test failed: $($p.ExitCode)" }
          $hash = (Get-FileHash 'Bookmark-Brain-Windows-x64.zip' -Algorithm SHA256).Hash.ToLower()
          "$hash  Bookmark-Brain-Windows-x64.zip" | Set-Content -Encoding ascii WINDOWS-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bookmark-brain-windows
          path: |
            Bookmark-Brain-Windows-x64.zip
            WINDOWS-SHA256SUMS.txt
            WINDOWS.md
  publish:
    if: inputs.publish
    needs: build
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bookmark-brain-windows
      - name: Upload approved assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" Bookmark-Brain-Windows-x64.zip WINDOWS-SHA256SUMS.txt WINDOWS.md --repo propagatemedia/bookmark-brain
